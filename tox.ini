[tox]
minversion = 4.0
envlist = pre-commit,builder,worker
skipsdist = True

# ``uv-venv-lock-runner`` (from tox-uv) provisions each env with ``uv sync``
# instead of pip. That's required, not a preference: this repo is a uv
# workspace, and ``worker`` depends on ``builder`` via ``{ workspace = true }``
# — a uv-only source that pip cannot resolve. Syncing
# also pins deps to the root uv.lock, so CI tests what production installs.
[testenv]
runner = uv-venv-lock-runner
with_dev = true

[testenv:pre-commit]
description = run pre-commit to ensure the changes are valid against our lintings
# Override the workspace lock runner above: this env installs its own tools with
# ``deps`` and never imports the project, so there's nothing to sync.
runner = uv-venv-runner
skip_install = true
deps =
   pre-commit
   docutils # Required for rst2html in vale
commands =
    pre-commit run --all-files --show-diff-on-failure

[testenv:builder]
description = run the builder test suite
# Match the interpreter the AMI syncs the venv against (uv-python).
basepython = python3.14
uv_sync_flags = --package, builder
# --cov-config is explicit because tox runs from the repo root, so coverage
# would otherwise look for config in the workspace-root pyproject.toml rather
# than the builder's. Reporting only — no threshold gates the build.
commands =
    pytest builder/tests \
        --cov=builder \
        --cov-config=builder/pyproject.toml \
        --cov-report=term-missing \
        {posargs}

[testenv:worker]
description = run the worker test suite
# Match the interpreter the AMI syncs the venv against.
basepython = python3.14
uv_sync_flags = --package, worker
setenv =
    # worker.celery reads this at import time.
    RTD_BROKER_URL = redis://localhost:6379/0
# --cov-config is explicit because tox runs from the repo root, so coverage
# would otherwise look for config in the workspace-root pyproject.toml rather
# than the worker's. Reporting only — no threshold gates the build.
commands =
    pytest worker/tests \
        --cov=worker \
        --cov-config=worker/pyproject.toml \
        --cov-report=term-missing \
        {posargs}
