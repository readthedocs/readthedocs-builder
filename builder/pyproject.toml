[project]
name = "builder"
version = "0.0.0"
description = "Read the Docs build runner. Executes build commands inside a build container via docker exec."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43",
    # ``docker exec`` into the build container the worker started
    # (builder/environments.py). Low-level APIClient, same as upstream.
    "docker>=7.1",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    # Direct import in environments.py (slumber.exceptions.HttpNotFoundError),
    # independent of the shared api_client — so declared here explicitly.
    "slumber>=0.7.1",
    "structlog>=25.0",
    # ``builder.api_client`` — the RTD API v2 client.
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Coverage is measured and reported, but nothing enforces a minimum: no
# ``fail_under``, no upload. It's here to watch the trend, not to gate CI.
[tool.coverage.run]
branch = true
source = ["builder"]
omit = ["builder/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
