version = "0.0.0"
source = { editable = "worker" }
dependencies = [
    { name = "boto3" },
    { name = "builder" },
    { name = "celery" },
    { name = "docker" },
    { name = "pyyaml" },
    { name = "redis" },
    { name = "requests" },
    { name = "structlog" },
]

[package.optional-dependencies]
observability = [
    { name = "newrelic" },
    { name = "sentry-sdk" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "requests-mock" },
]

[package.metadata]
requires-dist = [
    { name = "boto3", specifier = ">=1.43.105" },
    { name = "builder", editable = "builder" },
    { name = "celery", specifier = ">=5.3,<6.0" },
    { name = "docker", specifier = ">=7.1" },
    { name = "newrelic", marker = "extra == 'observability'" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "redis", specifier = ">=5.0,<6.0" },
    { name = "requests", specifier = ">=2.31" },
    { name = "sentry-sdk", marker = "extra == 'observability'" },
    { name = "structlog", specifier = ">=25.0" },
]
provides-extras = ["observability"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-cov", specifier = ">=5.0" },
    { name = "requests-mock", specifier = ">=1.12" },
]
