# uv workspace root for the readthedocs-builder monorepo.
#
# Two members:
#   - builder/  the build itself (drives the container via ``docker exec``)
#   - worker/   the Celery worker, which runs the builder in-process
#
# There is a SINGLE lockfile (uv.lock, next to this file) for the whole
# workspace, and a SINGLE venv: ``uv sync --package worker`` pulls in
# ``builder`` too, because the worker imports it. See the
# readthedocs-builder-setup.service systemd unit, which lives with the
# build-isolated AMI Packer config in readthedocs-ops at
# salt/base/utils/ops/build-isolated/systemd/.
[tool.uv.workspace]
members = ["builder", "worker"]

[tool.pytest.ini_options]
markers = [
    # Needs a reachable Docker daemon and the build images pulled. These are
    # the tests that check what mocks can't: that a command really runs in the
    # container, that ``user`` really drops privileges, and that the docroot
    # really resolves to the same files on both sides of the mount.
    #
    # Excluded by default (see ``addopts``); run them with ``-m docker``.
    "docker: requires a running Docker daemon",
]
addopts = "-m 'not docker'"
