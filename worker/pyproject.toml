[project]
name = "worker"
version = "0.0.0"
description = "Host-side Celery task that runs Read the Docs builds on ephemeral EC2 instances."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # Celery + broker.
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",

    # Self-terminate via autoscaling:TerminateInstanceInAutoScalingGroup +
    # the ec2:describe_instance calls that back it up.
    "boto3>=1.43",

    # Structured logging shared with the runner. Emits JSON in prod.
    "structlog>=25.0",

    # IMDS calls in worker/ec2.py.
    "requests>=2.31",

    # .readthedocs.yaml parsing (worker/tasks.py sparse-clones the yaml to
    # determine build.os before starting the container).
    "pyyaml>=6.0",

    # Build container lifecycle (worker/docker.py). The runner uses the same
    # client for ``docker exec``, so it is a direct dependency of both.
    "docker>=7.1",

    # The runner itself. Called in-process by ``run_build``.
    "builder",
]

[tool.uv.sources]
builder = { workspace = true }

[project.optional-dependencies]
# Production observability. Installed on the AMI at boot via
# ``uv sync --extra observability`` (see the systemd setup unit); dev
# omits it (the build-isolated compose entrypoint runs a plain
# ``uv sync``). newrelic-admin wraps the celery worker; Sentry is
# initialized from SENTRY_DSN inside worker.celery.
observability = [
    "newrelic",
    "sentry-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Mock the API at the HTTP layer rather than stubbing the client, matching
    # readthedocs.org's test suite.
    "requests-mock>=1.12",
]

# Coverage is measured and reported, but nothing enforces a minimum: no
# ``fail_under``, no upload. It's here to watch the trend, not to gate CI.
[tool.coverage.run]
branch = true
source = ["worker"]
omit = ["worker/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
